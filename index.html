
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiteSec - Stay Secure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --logo-cyan: #47E0FF;
            --logo-purple: #9B4DFF;
            --bg-deep: #0B0524;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-deep);
            color: #f8fafc;
            overflow-x: hidden;
            perspective: 1000px;
        }
        .liquid-glass {
            /* Ø²ÙØ§Ø¯Ø© Ø§ÙØ¹ØªØ§ÙØ© ÙÙ 0.03 Ø¥ÙÙ 0.1 ÙØ²ÙØ§Ø¯Ø© Ø§ÙÙØ¶ÙØ­ */
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border-radius: 2rem;
        }
        .logo-gradient-text {
            background: linear-gradient(to right, var(--logo-cyan), var(--logo-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-gradient-bg {
            background: linear-gradient(135deg, var(--logo-cyan), var(--logo-purple));
        }
        .card-3d {
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
        }
        .card-3d:hover {
            transform: translateY(-10px) rotateX(2deg) rotateY(-2deg);
            border-color: rgba(71, 224, 255, 0.4);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 20px rgba(71, 224, 255, 0.1);
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: linear-gradient(var(--logo-cyan), var(--logo-purple)); border-radius: 10px; }
        
        /* ØªØ£Ø«ÙØ± ÙØ¨Ø¶ ÙÙÙØ¬Ù ÙØ²ÙØ§Ø¯Ø© Ø§ÙØ§ÙØªØ¨Ø§Ù */
        .logo-pulse {
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(71, 224, 255, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(71, 224, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(71, 224, 255, 0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
