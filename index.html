
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiteSec - Stay Secure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --logo-cyan: #47E0FF;
            --logo-purple: #9B4DFF;
            --bg-deep: #0B0524;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-deep);
            color: #f8fafc;
            overflow-x: hidden;
            perspective: 1000px;
        }
        .liquid-glass {
            /* زيادة العتامة من 0.03 إلى 0.1 لزيادة الوضوح */
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border-radius: 2rem;
        }
        .logo-gradient-text {
            background: linear-gradient(to right, var(--logo-cyan), var(--logo-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-gradient-bg {
            background: linear-gradient(135deg, var(--logo-cyan), var(--logo-purple));
        }
        .card-3d {
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
        }
        .card-3d:hover {
            transform: translateY(-10px) rotateX(2deg) rotateY(-2deg);
            border-color: rgba(71, 224, 255, 0.4);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 20px rgba(71, 224, 255, 0.1);
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: linear-gradient(var(--logo-cyan), var(--logo-purple)); border-radius: 10px; }
        
        /* تأثير نبض للوجو لزيادة الانتباه */
        .logo-pulse {
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(71, 224, 255, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(71, 224, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(71, 224, 255, 0); }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "framer-motion": "https://esm.sh/framer-motion@^11.11.11"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
